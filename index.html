<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>skm.</title>
<style>
:root{--bg:#090909;--card:#151515;--line:#282828;--fg:#F5F5F5;--mut:#858585;--acc:#86E3A0;--warn:#E8B04A;
box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:480px;margin:0 auto;padding:20px 18px 40px;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:flex-start}
.logo{font-size:28px;font-weight:700;letter-spacing:-1px}.logo b{color:var(--acc)}
.clock{text-align:right;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.date{font-size:13px;color:var(--mut);margin-top:2px;font-weight:400;letter-spacing:0}
.status{margin:14px 0 20px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.status.ok .dot{background:var(--acc)}.status.old .dot{background:var(--warn)}.status.old{color:var(--warn)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:5px}
.seg button{border:0;background:none;color:var(--mut);font:600 15px inherit;font-family:inherit;padding:16px 0;border-radius:14px;transition:.2s;letter-spacing:.5px}
.seg button.on{background:var(--acc);color:#0a0a0a}
#list{margin-top:20px;display:flex;flex-direction:column;gap:12px;transition:opacity .15s,transform .15s}
#list.sw{opacity:0;transform:translateY(6px)}
.c{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.c.n{border-color:var(--acc)}
.r{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.t{font-size:38px;font-weight:600;letter-spacing:-1.5px}
.c:not(.n) .t{font-size:32px}
.ln{flex:1;height:1px;background:var(--line);margin:0 12px;position:relative;top:-8px}
.st{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1.2px;color:var(--mut);margin-top:2px}
.f{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
.in{color:var(--fg);font-weight:600}.n .in{color:var(--acc)}.now{color:var(--acc)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5}
.msg h2{color:var(--fg);font-size:17px;margin-bottom:8px}
.demo{background:#2a2110;color:var(--warn);font-size:12px;text-align:center;padding:8px;border-radius:12px;margin-top:14px;letter-spacing:.5px}
.bar{display:flex;gap:8px;margin-top:22px}
.bar button,.msg button,.imp button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--fg);font:500 14px inherit;font-family:inherit;padding:14px;border-radius:14px}
.msg button{margin:14px 4px 0;flex:none}
.src{font-size:11px;color:var(--mut);margin-top:18px;text-align:center}.imp{display:none;margin-top:14px}.imp.show{display:block}
.imp textarea{width:100%;height:150px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px;font:12px ui-monospace,monospace}
.imp p{font-size:12px;color:var(--mut);margin:0 0 8px;line-height:1.5}
.imp button{width:100%;margin-top:8px;background:var(--acc);color:#0a0a0a;border:0;font-weight:600}
#wrap{margin-top:8px;transition:opacity .15s,transform .15s}#wrap.sw{opacity:0;transform:translateY(6px)}
.stage{min-height:calc(100svh - 200px);display:flex;flex-direction:column}#hero{flex:1}#past{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.big{padding:22px 20px}.big .t{font-size:52px}.cd{font-size:30px;font-weight:600;color:var(--acc);margin-top:18px}.big .f{margin-top:12px}
.sect{margin:8px 4px 12px;font-size:12px;letter-spacing:1.4px;color:var(--mut);text-transform:uppercase}
.fade{animation:fd .35s ease both}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
.c.pst{opacity:.45;border-style:dashed}.c.pst .t{font-size:24px}
.lnk{background:none;border:0;color:var(--mut);font:13px inherit;font-family:inherit;padding:14px 0 0;display:block;margin:0 auto}
.mk{display:flex;align-items:center;justify-content:center;gap:12px;margin:34px auto 6px;color:var(--mut);text-decoration:none;font-size:12px;letter-spacing:.6px;width:max-content}
.mk b{color:var(--fg);font-weight:600}.mk:active{opacity:.7}
.vin{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:repeating-radial-gradient(circle,#0d0d0d 0 2px,#181818 2px 3px);animation:spin 5s linear infinite;flex:none}
.vin img{position:absolute;inset:0;margin:auto;width:46%;height:46%;border-radius:50%;object-fit:cover;background:var(--card)}
.vin:after{content:"";position:absolute;inset:0;margin:auto;width:4px;height:4px;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.vin{animation:none}}
.disc{display:block;width:max-content;margin:18px auto 20px}.disc .vin{width:56px;height:56px}
.vin.out{animation:dout .5s ease-in forwards}.vin.in{animation:din .8s cubic-bezier(.2,1.3,.4,1) both}
@keyframes dout{to{transform:translateX(110px) rotate(300deg);opacity:0}}
@keyframes din{from{transform:translateY(-46px) scale(.4) rotate(-200deg);opacity:0}to{transform:none;opacity:1}}

/* ========== DODANE: ZMIENNE KOLORÓW (oparte na istniejącej palecie) ========== */
:root{--chat-bg:var(--card);--chat-line:var(--line);--chat-me:var(--acc);--chat-me-fg:#0a0a0a;--chat-other:#202020;
--focus-bg:rgba(0,0,0,.82);--focus-panel:var(--card);--focus-accent:var(--acc);--focus-warn:var(--warn);--focus-danger:#FF6B6B}
body{padding-top:56px} /* miejsce na przycisk trybu skupienia, żeby nie zasłaniał zegara */
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bt{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:12px 18px;font:inherit;font-weight:500;cursor:pointer;transition:.2s ease}
.bt.pri{background:var(--acc);color:#0a0a0a;border-color:var(--acc);font-weight:600}.bt:active{transform:scale(.97)}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px}
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:12px;background:var(--focus-bg);opacity:0;transition:.2s ease}
.ov[hidden]{display:none}.ov.show{opacity:1}#nickModal{z-index:200}
.box,.fpanel{background:var(--focus-panel);border:1px solid var(--line);border-radius:22px;padding:22px;transform:scale(.94);transition:.2s ease}
.ov.show .box,.ov.show .fpanel{transform:none}
.box{width:min(340px,100%)}.box h2,.fpanel h2{font-size:17px;margin-bottom:12px;text-align:center}
.box input,.trow input{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px}
.err{color:var(--focus-danger);font-size:12px;min-height:16px;margin-top:6px}

/* ========== DODANE: CZAT ========== */
#chatBtn{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:52px;height:52px;border-radius:50%;border:0;background:var(--acc);color:#0a0a0a;font-size:22px;z-index:50;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.5);transition:.2s ease}
#chatBtn:active{transform:scale(.94)}
#chat{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);width:340px;height:460px;max-height:calc(100dvh - 110px);z-index:50;display:none;flex-direction:column;background:var(--chat-bg);border:1px solid var(--chat-line);border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#chat.open{display:flex;animation:pop .2s ease}@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.ch{display:flex;align-items:center;gap:4px;padding:12px 14px;border-bottom:1px solid var(--chat-line);font-weight:600}.ch .sp{flex:1}
.ib{background:none;border:0;color:var(--mut);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:8px;transition:.2s ease}.ib:hover{color:var(--fg)}
#nickEdit{opacity:0}.ch:hover #nickEdit,#nickEdit:focus-visible{opacity:1}@media(hover:none){#nickEdit{opacity:.6}}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:8px;max-width:85%;align-self:flex-start}.m.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:28px;height:28px;border-radius:50%;background:#2a2a2a;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}.me .av{background:var(--chat-me);color:var(--chat-me-fg)}
.bub{background:var(--chat-other);border-radius:14px;padding:7px 11px;font-size:14px;line-height:1.4;word-break:break-word}
.me .bub{background:var(--chat-me);color:var(--chat-me-fg)}
.meta{font-size:11px;color:var(--mut);margin-bottom:2px}.me .meta{color:rgba(10,10,10,.6)}
.cf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--chat-line)}
.cf input{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px}
.cf .bt{padding:0 14px}
@media(max-width:600px){#chat{inset:0;width:auto;height:auto;max-height:none;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px)}
body.chat-open #chatBtn{display:none}.cf input,.box input,.trow input{font-size:16px}}

/* ========== DODANE: TRYB SKUPIENIA ========== */
.fbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:60;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;font-family:inherit;padding:8px 14px;cursor:pointer;transition:.2s ease}
.fbtn:hover{border-color:var(--acc)}
.fpanel{position:relative;width:min(440px,100%);max-height:calc(100dvh - 24px);overflow-y:auto;outline:0}
.x{position:absolute;top:12px;right:12px}
.ring{position:relative;width:min(240px,60vw);aspect-ratio:1;margin:8px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}.ring .tr{stroke:var(--line)}
.ring .pg{stroke:var(--focus-accent);stroke-linecap:round;stroke-dasharray:565.49;stroke-dashoffset:0;transition:stroke .4s ease}
.tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#ftime{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:clamp(34px,11vw,48px);font-weight:600;letter-spacing:-1px}
#flabel{color:var(--mut);font-size:12px;margin-top:2px}
.fseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:5px;margin:14px 0 0}
.fseg button{border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:10px 0;border-radius:12px;cursor:pointer;transition:.2s ease}
.fseg button.on{background:var(--focus-accent);color:#0a0a0a}
.cnt{text-align:center;margin:14px 0;color:var(--mut);font-size:14px}
.trow{display:flex;gap:8px}.trow input{flex:1;min-width:0}
#tlist{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
#tlist li{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
#tlist label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;word-break:break-word;font-size:14px}
#tlist li.d span{text-decoration:line-through;color:var(--mut)}#tlist input{accent-color:var(--acc);width:18px;height:18px}
.conf{position:absolute;inset:0;background:rgba(21,21,21,.96);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.conf[hidden]{display:none}
@media(prefers-reduced-motion:reduce){.ov,.box,.fpanel,#chat{transition:none;animation:none}}

/* ===== DODANE v2: ładniejszy czat + bloki kodu ===== */
@media(min-width:601px){#chat{width:380px;height:540px;border-radius:24px}}
#chat{background:linear-gradient(180deg,#181818,#101010);box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 0 1px rgba(134,227,160,.1)}
.ch{padding:14px 16px;font-size:15px;background:rgba(255,255,255,.025)}
.dot2{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;transition:.3s}.dot2.ok{background:var(--acc);box-shadow:0 0 8px var(--acc)}
#msgs{padding:16px 14px;gap:12px}
.m{max-width:90%;align-items:flex-end;animation:pop .2s ease}
.bub{border-radius:18px 18px 18px 6px;padding:9px 13px;white-space:pre-wrap}.me .bub{border-radius:18px 18px 6px 18px}
.code{position:relative;margin:6px 0 2px;background:#0a0a0a;border:1px solid var(--line);border-radius:12px;white-space:normal}
.me .code{background:rgba(0,0,0,.2);border-color:rgba(0,0,0,.25)}
.code pre{margin:0;padding:26px 12px 10px;overflow-x:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:inherit;white-space:pre}
.cp{position:absolute;top:5px;right:6px;border:0;background:rgba(255,255,255,.1);color:inherit;font:600 11px inherit;font-family:inherit;padding:3px 8px;border-radius:8px;cursor:pointer}
.me .cp{background:rgba(0,0,0,.18)}
.cf{align-items:flex-end}
.cf textarea{flex:1;min-width:0;resize:none;max-height:120px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:14px;line-height:1.4;transition:.2s ease}
.cf textarea:focus{border-color:var(--acc);outline:0}
.cf .ib{font:600 13px ui-monospace,monospace;border:1px solid var(--line);border-radius:12px;padding:10px}
.empty{margin:auto;text-align:center;color:var(--mut);font-size:13px;line-height:1.7;padding:20px}.empty b{color:var(--acc);font-family:ui-monospace,monospace;font-size:15px}
.box label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
@media(max-width:600px){.cf textarea{font-size:16px}}
/* ===== DODANE v3: wyraźny przycisk zwijania czatu ===== */
.cl{font-size:13px;font-weight:600;font-family:inherit;color:var(--fg);background:rgba(255,255,255,.09);border-radius:999px;padding:8px 14px}
@media(max-width:600px){.ch{padding:12px 14px;min-height:56px}.cl{font-size:15px;padding:10px 18px}}
</style>
</head>
<body>
<header><div class="logo">skm<b>.</b></div><div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div></header>
<div class="status" id="status"><span class="dot"></span><span id="stxt"></span></div>
<div class="seg"><button id="b-w">→ WZGÓRZE</button><button id="b-r">← RUMIA</button></div>
<button class="lnk" id="pastbtn" hidden></button>
<div id="past"></div>
<div id="wrap"><div class="stage"><div id="hero"></div><a class="disc" id="disc" href="https://soundcloud.com/drmoneta" target="_blank" rel="noopener" aria-label="drmoneta na SoundCloud"><span class="vin"><img src="https://i1.sndcdn.com/avatars-Fg0c9oBkJVjKygK0-7Txx8w-t200x200.jpg" alt="" referrerpolicy="no-referrer" onerror="this.remove()"></span></a></div><div class="sect" id="nexthead" hidden>Kolejne odjazdy</div><div id="list"></div></div>
<div id="sent"></div>
<div class="src">Rozkład planowy, bez opóźnień. W święta może obowiązywać inny rozkład.</div>
<div class="bar"><button id="ref">Odśwież</button><button id="inst" hidden>Dodaj do ekranu</button></div>
<a class="mk" href="https://soundcloud.com/drmoneta" target="_blank" rel="noopener"><span>made by <b>drmoneta</b></span></a>

<!-- ========== DODANE: CZAT ========== -->
<button id="chatBtn" aria-label="Otwórz czat" aria-expanded="false">💬</button>
<section id="chat" aria-label="Czat">
 <div class="ch"><span>Czat</span><i id="chatDot" class="dot2" title="Łączenie…"></i><button id="nickEdit" class="ib" aria-label="Zmień nick">✏️</button><span class="sp"></span><button id="chatClose" class="ib cl" aria-label="Zwiń czat">▾ Zwiń</button></div>
 <div id="msgs" aria-live="polite"></div>
 <form id="chatForm" class="cf"><button type="button" id="codeBtn" class="ib" aria-label="Wstaw blok kodu" title="Blok kodu">&lt;/&gt;</button><textarea id="chatIn" rows="1" maxlength="1500" placeholder="Wiadomość lub kod… (Shift+Enter = nowa linia)" aria-label="Wiadomość"></textarea><button class="bt pri" aria-label="Wyślij wiadomość">Wyślij</button></form>
</section>
<!-- ========== DODANE: MODAL ZMIANY NICKU ========== -->
<div id="nickModal" class="ov" hidden role="dialog" aria-modal="true" aria-labelledby="nickTitle">
 <div class="box"><h2 id="nickTitle">Ustawienia czatu</h2>
  <label for="nickInput">Twój nick</label><input id="nickInput" maxlength="20" autocomplete="off">
  <label for="roomInput">Kod pokoju (taki sam u całej klasy)</label><input id="roomInput" maxlength="30" autocomplete="off">
  <div class="row"><button id="roomLink" type="button" class="bt">Kopiuj link do pokoju</button></div><div id="nickErr" class="err" role="alert"></div>
  <div class="row"><button id="nickCancel" class="bt">Anuluj</button><button id="nickSave" class="bt pri">Zapisz</button></div></div>
</div>
<!-- ========== DODANE: TRYB SKUPIENIA ========== -->
<button id="focusBtn" class="fbtn" aria-label="Otwórz tryb skupienia">🎯 Tryb skupienia</button>
<div id="focus" class="ov" hidden role="dialog" aria-modal="true" aria-label="Tryb skupienia">
 <div class="fpanel" id="fpanel" tabindex="-1">
  <button id="fclose" class="ib x" aria-label="Zamknij tryb skupienia">✕</button>
  <h2 id="fhello"></h2>
  <div class="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="tr" cx="100" cy="100" r="90"/><circle id="fprog" class="pg" cx="100" cy="100" r="90"/></svg>
   <div class="tm"><div id="ftime" role="timer">25:00</div><small id="flabel">Gotowy</small></div></div>
  <div class="fseg" role="group" aria-label="Długość pomodoro"><button data-m="25" aria-label="25 minut">25</button><button data-m="45" aria-label="45 minut">45</button><button data-m="60" aria-label="60 minut">60</button></div>
  <div class="row"><button id="fstart" class="bt pri">Start</button><button id="freset" class="bt" aria-label="Resetuj timer">Reset</button></div>
  <div class="cnt" id="fcount"></div>
  <form id="tform" class="trow"><input id="tin" maxlength="100" autocomplete="off" placeholder="Dodaj zadanie…" aria-label="Nowe zadanie"><button class="bt pri" aria-label="Dodaj zadanie">+</button></form>
  <ul id="tlist"></ul>
  <div id="fconf" class="conf" hidden role="alertdialog" aria-label="Potwierdzenie">Timer w trakcie. Na pewno zamknąć?
   <div class="row"><button id="fno" class="bt">Nie</button><button id="fyes" class="bt pri">Zamknij</button></div></div>
 </div>
</div>
<script>
const TZ="Europe/Warsaw",$=id=>document.getElementById(id);
const LS={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const tf=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}),df=new Intl.DateTimeFormat("en-CA",{timeZone:TZ});
function now(){const p={};tf.formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return{sec:(+p.hour%24)*3600+ +p.minute*60+ +p.second,ymd:df.format(new Date()),hm:(p.hour%24+"").padStart(2,"0")+":"+p.minute}}
const dayStr=o=>df.format(new Date(Date.now()+o*864e5));
const toMin=s=>{const[h,m]=s.split(":").map(Number);return h*60+m},disp=s=>String(Math.floor(toMin(s)/60)%24).padStart(2,"0")+":"+s.slice(3,5);
let dir=LS.g("dir")==="wzgorze"?"wzgorze":"rumia",demo=false,live=false,data=null,okAt=LS.g("okAt"),shown=0,showPast=false,busy=false;const seen=new Set();
try{data=JSON.parse(LS.g("data")||"null")}catch(e){}

function dayGet(y){if(data&&data.days&&data.days[y])return data.days[y];const w=new Date(y+"T12:00:00Z").getUTCDay();return w>0&&w<6?EMBD:null}
function trains(){const n=now(),get=dayGet,today=get(n.ymd);if(!today)return null;if(!today[dir])return{none:1,up:[],past:[]};
 const mk=(p,sh)=>{const m=toMin(p[0])-sh;return{k:dir+"|"+m+"|"+p[1],m,d:p[0],a:p[1],tt:(toMin(p[1])-toMin(p[0])+1440)%1440}};
 const all=(today[dir]||[]).map(p=>mk(p,0));
 {const y=get(dayStr(-1));((y&&y[dir])||[]).forEach(p=>{if(toMin(p[0])>=1440)all.push(mk(p,1440))})}
 const ks=new Set(),out=[];all.sort((a,b)=>a.m-b.m).forEach(x=>{if(!ks.has(x.k)){ks.add(x.k);x.left=x.m*60-n.sec;out.push(x)}});
 return{up:out.filter(x=>x.left>0),past:out.filter(x=>x.left<=0)}}
const lab=m=>m<=1?"Odjeżdża":m>=60?`Za ${Math.floor(m/60)} h ${m%60} min`:`Za ${m} min`;
function render(){const n=now();$("clock").textContent=n.hm;
 $("date").textContent=new Intl.DateTimeFormat("pl-PL",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"}).format(new Date());
 $("b-w").className=dir==="rumia"?"on":"";$("b-r").className=dir==="wzgorze"?"on":"";
 const st=$("status"),tx=$("stxt"),t=okAt&&new Date(okAt).toLocaleString("pl-PL",{timeZone:TZ,hour:"2-digit",minute:"2-digit",day:"numeric",month:"numeric"});
 st.className="status";tx.textContent=data&&data.generated?"Rozkład planowy · plik z "+new Date(data.generated).toLocaleDateString("pl-PL",{timeZone:TZ}):"Rozkład planowy · sprawdzony 29.09.2026 · bez opóźnień";
 const from=dir==="rumia"?"RUMIA":"WZGÓRZE",to=dir==="rumia"?"WZGÓRZE":"RUMIA",T=trains();
 const card=(x,c,f)=>`<div class="c ${c} ${seen.has(x.k)?"":"fade"}"><div class="r"><span class="t">${disp(x.d)}</span><span class="ln"></span><span class="t">${disp(x.a)}</span></div><div class="st"><span>${from}</span><span>${to}</span></div>${f}</div>`;
 let h,l="",p="",nh=false;
 if(!T||T.none)h='<div class="msg"><h2>Brak rozkładu dla tego dnia lub kierunku</h2>W aplikacji jest na razie tylko rozkład na dni robocze (pon–pt). Sobotę i niedzielę uzupełnia plik schedule.json (npm run schedule).</div>';
 else if(!T.up.length){const tm=data&&data.days&&data.days[dayStr(1)],f=tm&&(tm[dir]||[])[0];h='<div class="msg"><h2>Na dziś to już wszystko</h2>Brak kolejnych odjazdów w tym kierunku.'+(f?"<br>Pierwszy jutro: "+disp(f[0]):"")+'</div>'}
 else{const x=T.up[0],m=Math.ceil(x.left/60);
  h=card(x,"n big",`<div class="cd">${lab(m)}</div><div class="f"><span>${x.tt} min podróży · bez przesiadek</span><span>planowo</span></div>`);
  const rest=T.up.slice(1);nh=rest.length>0;
  l=rest.slice(0,shown).map(y=>card(y,"",`<div class="f"><span>${y.tt} min podróży</span><span class="in">${lab(Math.ceil(y.left/60))}</span></div>`)).join("");
  if(T.up[0]&&showPast&&T.past.length)p='<div class="sect">Wcześniejsze — już odjechały</div>'+T.past.slice(-10).map(y=>card(y,"pst",`<div class="f"><span>odjechał</span><span></span></div>`)).join("")}
 if(T&&!T.up.length&&showPast&&T.past.length)p='<div class="sect">Wcześniejsze — już odjechały</div>'+T.past.slice(-10).map(y=>card(y,"pst",`<div class="f"><span>odjechał</span><span></span></div>`)).join("");
 const pb=$("pastbtn");pb.hidden=!(T&&T.past.length);pb.textContent=showPast?"Ukryj wcześniejsze":"Pokaż wcześniejsze";
 [["hero",h],["list",l],["past",p]].forEach(([id,v])=>{const e=$(id);if(e._h!==v){e.innerHTML=v;e._h=v}});$("nexthead").hidden=!nh;
 if(T)T.up.slice(0,1+shown).concat(showPast?T.past.slice(-10):[]).forEach(x=>seen.add(x.k))}
async function load(){if(busy)return;busy=true;$("ref").textContent="…";demo=false;
 try{const r=await fetch("schedule.json",{cache:"no-store"});if(!r.ok)throw 0;data=await r.json();live=true;okAt=new Date().toISOString();LS.s("data",JSON.stringify(data));LS.s("okAt",okAt)}catch(e){live=false}
 busy=false;$("ref").textContent="Odśwież";render()}
function setDir(d){if(d===dir)return;dir=d;LS.s("dir",d);shown=0;showPast=false;const w=$("wrap");w.classList.add("sw");setTimeout(()=>{scrollTo(0,0);render();w.classList.remove("sw")},150)}
$("b-w").onclick=()=>setDir("rumia");$("b-r").onclick=()=>setDir("wzgorze");$("ref").onclick=load;

<script>
/* ===================== DODANE: CZAT + NICK + TRYB SKUPIENIA ===================== */
(function(){
"use strict";
/* ---------- Narzędzia ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const rawGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const rawSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){rawSet(k,JSON.stringify(v))}};
const timers={};
function openOv(el){clearTimeout(timers[el.id]);el.hidden=false;void el.offsetWidth;el.classList.add("show")}
function closeOv(el){el.classList.remove("show");timers[el.id]=setTimeout(()=>{el.hidden=true},200)}

/* ---------- Nick (klucz: chat_nick) i identyfikator klienta ---------- */
let nick=rawGet("chat_nick");
if(!nick){nick="Gość-"+String(Math.floor(Math.random()*10000)).padStart(4,"0");rawSet("chat_nick",nick)}
let cid=rawGet("chat_cid");
if(!cid){cid=Date.now().toString(36)+Math.random().toString(36).slice(2,8);rawSet("chat_cid",cid)}

/* ---------- Pokój czatu (wspólny kod = wspólny czat) ---------- */
const validRoom=v=>/^[a-z0-9-]{4,30}$/.test(v);
let room=rawGet("chat_room");
{const q=(new URLSearchParams(location.search).get("pokoj")||"").toLowerCase();if(validRoom(q)){room=q;rawSet("chat_room",q)}}
if(!validRoom(room||"")){room=Math.random().toString(36).slice(2,8);rawSet("chat_room",room)}

/* ---------- Backend czatu: ntfy.sh (publiczny serwer pub/sub, bez konta) ----------
   TODO: podmień na prawdziwy backend (np. Firebase) – wystarczy zmienić load(), send(m), connect().
   const FIREBASE_CONFIG = { apiKey:"", authDomain:"", databaseURL:"", projectId:"", appId:"" }; // <- tu wklej konfigurację */
function setStatus(ok){const d=$("chatDot");d.classList.toggle("ok",ok);d.title=ok?"Połączono":"Brak połączenia"}
const Backend={
 base:"https://ntfy.sh/skmchat-",msgs:[],cb:function(){},es:null,
 load(){return this.msgs},
 add(m){
  if(!m||typeof m.id!=="string"||typeof m.nick!=="string"||typeof m.text!=="string"||typeof m.cid!=="string"||typeof m.ts!=="number")return;
  if(this.msgs.some(x=>x.id===m.id))return;
  this.msgs.push({id:m.id,cid:m.cid,nick:m.nick.slice(0,20),text:m.text.slice(0,1500),ts:m.ts});
  this.msgs.sort((a,b)=>a.ts-b.ts);this.msgs=this.msgs.slice(-200); /* limit 200 */
  store.set("chat_cache_"+room,this.msgs)},
 async send(m){this.add(m);this.cb();
  try{const r=await fetch(this.base+room,{method:"POST",body:JSON.stringify(m)});if(!r.ok)throw 0}catch(e){setStatus(false)}},
 onUpdate(cb){this.cb=cb},
 connect(){
  if(this.es)this.es.close();
  this.msgs=store.get("chat_cache_"+room,[]);this.cb();
  const es=this.es=new EventSource(this.base+room+"/sse?since=12h");
  es.onopen=()=>setStatus(true);es.onerror=()=>setStatus(false);
  es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event!=="message")return;this.add(JSON.parse(d.message));this.cb()}catch(x){}}}
};

/* ---------- Czat: UI ---------- */
const chat=$("chat"),msgs=$("msgs"),chatIn=$("chatIn");
const hue=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%360;return h};
function body(t){ /* ```kod``` -> blok z przyciskiem Kopiuj; reszta to zwykły tekst (wszystko escapowane) */
 return t.split("```").map((p,i)=>i%2?`<div class="code"><button class="cp" data-copy aria-label="Kopiuj kod">Kopiuj</button><pre>${esc(p.replace(/^[^\n]*\n/,""))}</pre></div>`:(p.trim()?esc(p.replace(/^\n+|\n+$/g,"")):"")).join("")}
function renderChat(){
 const all=Backend.load();
 msgs.innerHTML=all.length?all.map(m=>{
  const t=new Date(m.ts).toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"}),me=m.cid===cid,h=hue(m.nick);
  return `<div class="m${me?" me":""}"><div class="av" aria-hidden="true"${me?"":` style="background:hsl(${h} 45% 30%);color:hsl(${h} 80% 85%)"`}>${esc(([...m.nick][0]||"?").toUpperCase())}</div><div class="bub"><div class="meta"${me?"":` style="color:hsl(${h} 70% 70%)"`}>${esc(m.nick)} · ${t}</div>${body(m.text)}</div></div>`}).join("")
 :`<div class="empty">Brak wiadomości.<br>Kod pokoju: <b>${esc(room)}</b><br>Podaj go klasie (✏️ → „Kopiuj link").<br>Kod w czacie wklejaj w blokach: przycisk &lt;/&gt;</div>`;
 msgs.scrollTop=msgs.scrollHeight; /* auto-scroll */
}
function setChat(open){
 chat.classList.toggle("open",open);document.body.classList.toggle("chat-open",open);
 $("chatBtn").setAttribute("aria-expanded",open);
 if(open){fitChat();renderChat();chatIn.focus()}else $("chatBtn").focus();
}
$("chatBtn").onclick=()=>setChat(!chat.classList.contains("open"));
$("chatClose").onclick=()=>setChat(false);
$("chatForm").onsubmit=e=>{e.preventDefault(); /* Enter też wysyła */
 const text=chatIn.value.trim();if(!text)return;
 Backend.send({id:Date.now()+"-"+Math.random().toString(36).slice(2,6),cid,nick,text,ts:Date.now()});
 chatIn.value="";chatIn.style.height="";renderChat()};
Backend.onUpdate(renderChat);Backend.connect();
/* iPhone: dopasuj wysokość czatu do widocznego obszaru (klawiatura nie zasłania pola ani przycisku Zwiń) */
function fitChat(){const vv=window.visualViewport,m=matchMedia("(max-width:600px)").matches;
 if(vv&&m&&chat.classList.contains("open")){chat.style.height=vv.height+"px";chat.style.top=vv.offsetTop+"px";chat.style.bottom="auto"}
 else{chat.style.height=chat.style.top=chat.style.bottom=""}
 msgs.scrollTop=msgs.scrollHeight}
if(window.visualViewport){visualViewport.addEventListener("resize",fitChat);visualViewport.addEventListener("scroll",fitChat)}
chatIn.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("chatForm").requestSubmit()}}; /* Enter wysyła, Shift+Enter = nowa linia */
chatIn.oninput=()=>{chatIn.style.height="auto";chatIn.style.height=chatIn.scrollHeight+"px"};
$("codeBtn").onclick=()=>{const v=chatIn.value;chatIn.value=v.includes("```")?v:"```\n"+v+"\n```";chatIn.focus();chatIn.oninput()};
msgs.onclick=e=>{const b=e.target.closest("[data-copy]");if(!b)return;const txt=b.nextElementSibling.textContent;
 (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{b.textContent="Skopiowano ✓"},()=>{b.textContent="Zaznacz ręcznie"});setTimeout(()=>b.textContent="Kopiuj",1500)};

/* ---------- Zmiana nicku ---------- */
const nm=$("nickModal"),ni=$("nickInput"),ne=$("nickErr");
function openNick(){$("roomInput").value=room;ni.value=nick;ne.textContent="";openOv(nm);ni.focus();ni.select()}
function closeNick(){closeOv(nm);$("nickEdit").focus()}
function saveNick(){
 const v=ni.value.trim(),r=$("roomInput").value.trim().toLowerCase();
 if(!/^[\p{L}\p{N} -]{2,20}$/u.test(v)){ne.textContent="Nick: 2–20 znaków, tylko litery, cyfry, spacja i myślnik.";return}
 if(!validRoom(r)){ne.textContent="Kod pokoju: 4–30 znaków, małe litery a–z, cyfry, myślnik.";return}
 nick=v;rawSet("chat_nick",nick);$("fhello").textContent="Cześć, "+nick+"!";
 if(r!==room){room=r;rawSet("chat_room",room);Backend.connect()}
 closeNick()}
$("roomLink").onclick=()=>{const u=location.origin+location.pathname+"?pokoj="+($("roomInput").value.trim().toLowerCase()||room);
 (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{ne.textContent="Link skopiowany ✓"},()=>{ne.textContent=u})};
$("nickEdit").onclick=openNick;$("nickCancel").onclick=closeNick;$("nickSave").onclick=saveNick;
ni.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();saveNick()}};
nm.onclick=e=>{if(e.target===nm)closeNick()};

/* ---------- Tryb skupienia: elementy i stan ---------- */
const fo=$("focus"),fpanel=$("fpanel"),fprog=$("fprog"),ftime=$("ftime"),flabel=$("flabel"),fstart=$("fstart"),fconf=$("fconf");
const C=2*Math.PI*90; /* obwód ringu */
let len=+store.get("focus_len",25);if(![25,45,60].includes(len))len=25;
let total=len*60000,left=total,running=false,endAt=0,raf=0,to=0,actx=null,lastFocus=null;

/* ---------- Timer: rysowanie ringu i czasu ---------- */
function fmt(ms){const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function paint(){
 fprog.style.strokeDashoffset=C*(1-(total?left/total:0)); /* pierścień płynnie się kurczy */
 ftime.textContent=fmt(left);
 const s=left/1000;fprog.style.stroke=s<60?"var(--focus-danger)":s<300?"var(--focus-warn)":"var(--focus-accent)"}
function tick(){if(!running)return;left=Math.max(0,endAt-Date.now());paint();if(left<=0){finish();return}raf=requestAnimationFrame(tick)}
function halt(){running=false;cancelAnimationFrame(raf);clearTimeout(to);fstart.textContent="Start"}
function start(){
 if(left<=0)left=total;
 try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){} /* odblokowanie dźwięku gestem użytkownika */
 if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();
 running=true;endAt=Date.now()+left;fstart.textContent="Pauza";flabel.textContent="Skupienie";
 raf=requestAnimationFrame(tick);to=setTimeout(tick,left+30)} /* setTimeout działa też w tle karty */
function pause(){left=Math.max(0,endAt-Date.now());halt();flabel.textContent="Pauza";paint()}
function reset(){halt();left=total;flabel.textContent="Gotowy";paint()}
function finish(){halt();left=0;paint();flabel.textContent="Koniec! 🍅";beep();notify();addDone()}
function setLen(m){if(running)return;len=m;total=m*60000;left=total;store.set("focus_len",m);segs();flabel.textContent="Gotowy";paint()}
function segs(){document.querySelectorAll(".fseg button").forEach(b=>b.classList.toggle("on",+b.dataset.m===len))}
fstart.onclick=()=>running?pause():start();$("freset").onclick=reset;
document.querySelectorAll(".fseg button").forEach(b=>b.onclick=()=>setLen(+b.dataset.m));

/* ---------- Dźwięk i powiadomienie ---------- */
function beep(){try{const t=actx.currentTime;[0,.25,.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);
 g.gain.setValueAtTime(.2,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.2);o.start(t+d);o.stop(t+d+.2)})}catch(e){}}
function notify(){try{if("Notification" in window&&Notification.permission==="granted")new Notification("🍅 Pomodoro zakończone!",{body:"Czas na przerwę, "+nick+"."})}catch(e){}}

/* ---------- Licznik pomodoro dziś (reset o północy – porównanie daty) ---------- */
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function getDone(){const o=store.get("focus_done",null);return o&&o.date===today()?o.n:0}
function paintCount(){$("fcount").textContent="🍅 x "+getDone()}
function addDone(){store.set("focus_done",{date:today(),n:getDone()+1});paintCount()}

/* ---------- Lista zadań (klucz: focus_tasks) ---------- */
let tasks=store.get("focus_tasks",[]);if(!Array.isArray(tasks))tasks=[];
const tlist=$("tlist");
function paintTasks(){tlist.innerHTML=tasks.map(t=>`<li class="${t.done?"d":""}"><label><input type="checkbox" data-id="${esc(t.id)}"${t.done?" checked":""}><span>${esc(t.t)}</span></label><button class="ib" data-del="${esc(t.id)}" aria-label="Usuń zadanie">✕</button></li>`).join("")}
function saveTasks(){store.set("focus_tasks",tasks);paintTasks()}
$("tform").onsubmit=e=>{e.preventDefault();const v=$("tin").value.trim();if(!v)return;tasks.push({id:Date.now()+""+Math.floor(Math.random()*1000),t:v,done:false});$("tin").value="";saveTasks()};
tlist.onchange=e=>{const t=tasks.find(x=>x.id===e.target.dataset.id);if(t){t.done=e.target.checked;saveTasks()}};
tlist.onclick=e=>{const id=e.target.dataset&&e.target.dataset.del;if(id){tasks=tasks.filter(x=>x.id!==id);saveTasks()}};

/* ---------- Otwieranie / zamykanie trybu skupienia ---------- */
function openFocus(){lastFocus=document.activeElement;$("fhello").textContent="Cześć, "+nick+"!";paintCount();paintTasks();segs();paint();
 openOv(fo);document.body.style.overflow="hidden";fpanel.focus()}
function closeFocus(){closeOv(fo);fconf.hidden=true;document.body.style.overflow="";if(lastFocus)lastFocus.focus()}
function reqClose(){if(running){fconf.hidden=false;$("fyes").focus()}else closeFocus()} /* aktywny timer -> potwierdzenie */
